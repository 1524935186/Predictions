  <text x="160" y="228" font-family="Barlow Condensed, Arial Narrow, sans-serif" font-weight="800" font-style="italic" font-size="14" fill="#0A1222" text-anchor="middle" letter-spacing="1">CORTINA · THE MORNING AFTER</text>
