  <g transform="translate(34 118)">
    <rect x="0" y="22" width="44" height="12" rx="3" fill="#8A5A2B"/>
    <rect x="0" y="14" width="44" height="9" fill="#F4E3C2"/>
    <rect x="0" y="6" width="44" height="9" fill="#8A5A2B"/>
