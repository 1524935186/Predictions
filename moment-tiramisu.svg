    <rect x="0" y="-3" width="44" height="4" rx="2" fill="#4A2C17"/>
    <circle cx="10" cy="-10" r="2" fill="#F2F5FA"/><circle cx="24" cy="-15" r="2" fill="#F2F5FA"/><circle cx="37" cy="-9" r="2" fill="#F2F5FA"/>
    <text x="22" y="52" font-family="Barlow Condensed, Arial Narrow, sans-serif" font-weight="900" font-style="italic" font-size="13" fill="#0A1222" text-anchor="middle">1ST</text>
