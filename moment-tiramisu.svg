    <radialGradient id="puddle" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#9CCB4A"/><stop offset="1" stop-color="#6E9E2B"/></radialGradient>
  </defs>
  <!-- night sky and snow -->
