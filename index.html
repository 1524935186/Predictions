<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2B3A55">
<title>Podium League</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=Source+Sans+3:wght@400;600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top" id="top">
  <div class="top-inner">
    <a href="#/" class="brand" id="brand">Podium League</a>
    <div class="who" id="who" hidden>
      <span class="who-name" id="who-name"></span>
      <span class="who-rank" id="who-rank"></span>
    </div>
  </div>
</header>

<main id="view" class="view" aria-live="polite"></main>

<nav class="tabs" id="tabs" hidden>
  <a href="#/" data-tab="home">
    <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 11 12 4l9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
    Races
  </a>
  <a href="#/table" data-tab="table">
    <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 20h16M7 20v-8m5 8V6m5 14v-11"/></svg>
    Table
  </a>
  <a href="#/me" data-tab="me">
    <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
    Me
  </a>
  <a href="#/admin" data-tab="admin" id="tab-admin" hidden>
    <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7z"/></svg>
    Admin
  </a>
</nav>

<div class="toast" id="toast" role="status" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
